<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 検索避け -->
  <meta name="robots" content="noindex, nofollow">

  <title>DEMO.3「Beige」</title>

  <style>
    body {
      margin: 0;
      padding: 50px 24px;
      background: #f7f6f2;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 50px;
    }

    .track {
      margin-bottom: 34px;
    }

    .title {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .number {
      display: inline-block;
      width: 30px;
      color: #999;
      font-size: 13px;
    }

    audio {
      width: 100%;
      height: 40px;
    }

    footer {
      margin-top: 70px;
      color: #aaa;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main>

    <h1>DEMO.3「Beige」</h1>

    <div class="subtitle">
      5 tracks
    </div>


    <div class="track">
      <div class="title">
        <span class="number">01</span>みずうみのゆめ
      </div>

      <audio controls preload="none">
        <source src="01.mp3" type="audio/mpeg">
      </audio>
    </div>


    <div class="track">
      <div class="title">
        <span class="number">02</span>とうめい
      </div>

      <audio controls preload="none">
        <source src="02.mp3" type="audio/mpeg">
      </audio>
    </div>


    <div class="track">
      <div class="title">
        <span class="number">03</span>平行
      </div>

      <audio controls preload="none">
        <source src="03.mp3" type="audio/mpeg">
      </audio>
    </div>


    <div class="track">
      <div class="title">
        <span class="number">04</span>papa
      </div>

      <audio controls preload="none">
        <source src="04.mp3" type="audio/mpeg">
      </audio>
    </div>


    <div class="track">
      <div class="title">
        <span class="number">05</span>すりがらす
      </div>

      <audio controls preload="none">
        <source src="05.mp3" type="audio/mpeg">
      </audio>
    </div>


    <footer>
      DEMO.3「Beige」
    </footer>

  </main>

</body>
</html>
