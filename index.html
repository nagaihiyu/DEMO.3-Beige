    (function(d) {
      var config = {
        kitId: "qtl1pmd",

        h.className =
          h.className.replace(/\bwf-loading\b/g, "") +

      var s = d.getElementsByTagName("script")[0];

      h.className += " wf-loading";

      tk.src =
        "https://use.typekit.net/" +
        config.kitId +
        ".js";

      tk.async = true;

      tk.onload = tk.onreadystatechange = function() {
        a = this.readyState;

  </script>


  <style>

    * {
      box-sizing: border-box;

    html,

    }


    .track-title {

      margin-bottom: 5px;

      font-size: 13px;
      font-weight: 400;

      line-height: 1.3;

      letter-spacing: 0.03em;
    }


    /* プレイヤー */

    .player {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;

      gap: 7px;
    }


    .play-button,
    .time,
    .menu-button,
    .menu {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    }


    .play-button {
      width: 20px;
      height: 20px;

      padding: 0;

      border: none;
      background: transparent;

      color: #333333;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 12px;
      line-height: 1;

      flex-shrink: 0;
    }


    .progress-area {
      flex: 1;

      min-width: 0;

      display: flex;
      align-items: center;

      gap: 8px;
    }


    .progress-bar {
      position: relative;

      flex: 1;

      min-width: 0;

      height: 12px;

      cursor: pointer;

      display: flex;
      align-items: center;
    }


    .progress-bar::before {
      content: "";

      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 1px;

      background:
        rgba(51, 51, 51, 0.45);

      transform:
        translateY(-50%);
    }


    .progress-fill {
      position: absolute;

      left: 0;
      top: 50%;

      width: 0;
      height: 1px;

      background: #333333;

      transform:
        translateY(-50%);
    }


    .progress-dot {
      position: absolute;

      left: 0;
      top: 50%;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #333333;

      transform:
        translate(-50%, -50%);
    }


    .time {
      flex-shrink: 0;

      white-space: nowrap;

      font-size: 10px;

      line-height: 1;

      letter-spacing: 0.02em;
    }


    /* メニューボタン */

    .menu-button {
      width: 20px;
      height: 24px;

      padding: 0;

      border: none;
      background: transparent;

      color: #333333;

      cursor: pointer;

      font-size: 18px;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }


    /* ダウンロードメニュー */

    .menu {
      position: absolute;

      right: 0;
      bottom: 30px;

      display: none;

      padding: 8px 12px;

      background:
        rgba(255, 255, 255, 0.95);

      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.08);

      z-index: 10;
    }


    .menu.open {
      display: block;
    }


    .menu a {
      color: #333333;

      text-decoration: none;

      font-size: 11px;

      white-space: nowrap;
    }


    /* 06 Lyrics Card */

    .lyrics-track {
      margin-bottom: 20px;
    }


    .lyrics-button {
      display: block;

      width: 100%;

      padding: 0;

      border: none;

      background: transparent;

      color: #333333;

      font-family:
        "dnp-shuei-nmincho-std",
        sans-serif;

      font-size: 13px;
      font-weight: 400;

      line-height: 1.3;

      letter-spacing: 0.03em;

      text-align: left;

      cursor: pointer;
    }


    /* Lyrics Card モーダル */

    .lyrics-modal {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        rgba(51, 51, 51, 0.25);

      z-index: 100;
    }


    .lyrics-modal.open {
      display: flex;
    }


    .lyrics-card {
      position: relative;

      max-width: 90vw;
      max-height: 90vh;
    }


    .lyrics-card img {
      display: block;

      width: auto;
      height: auto;

      max-width: 90vw;
      max-height: 90vh;
    }


    .lyrics-close {
      position: absolute;

      top: -30px;
      right: 0;

      width: 24px;
      height: 24px;

      padding: 0;

      border: none;

      background: transparent;

      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      font-size: 20px;

      font-weight: 300;

      line-height: 1;

      cursor: pointer;
    }


    /* Footer */

    footer {

      padding-bottom: 20px;

        -apple-system,
        BlinkMacSystemFont,

        sans-serif;

      letter-spacing: 0.03em;

    .distribution-warning {

      right: 0;
      top: 16px;

      font-size: 8px;

      color:
        rgba(51, 51, 51, 0.55);

      letter-spacing: 0.03em;

      white-space: nowrap;
    }


    /* スマホ */

      body {
        padding:
          70px 24px 32px;
      }

        margin-bottom: 40px;

        font-size: 19px;
      }

        margin-bottom: 20px;
      }


      .track-title,
      .lyrics-button {
        font-size: 13px;
      }


      footer {
        margin-top: 40px;
      }

    }

  </style>

  <script>

    const players =
      document.querySelectorAll(".player");


    players.forEach(player => {

      const audio =
        player.querySelector("audio");

      const playButton =
        player.querySelector(
          ".play-button"
        );

      const progressBar =
        player.querySelector(
          ".progress-bar"
        );

      const progressFill =
        player.querySelector(
          ".progress-fill"
        );

      const progressDot =
        player.querySelector(
          ".progress-dot"
        );

      const currentTime =
        player.querySelector(
          ".current"
        );

      const duration =
        player.querySelector(
          ".duration"
        );

      const menuButton =
        player.querySelector(
          ".menu-button"
        );

      const menu =
        player.querySelector(
          ".menu"
        );


      function formatTime(seconds) {

        if (!isFinite(seconds)) {
          return "0:00";
        }

        const minutes =
          Math.floor(seconds / 60);

        const secs =
          Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

        return minutes + ":" + secs;
      }


      /* 再生・停止 */

      playButton.addEventListener(
        "click",
        () => {

          players.forEach(
            otherPlayer => {

              const otherAudio =
                otherPlayer.querySelector(
                  "audio"
                );

              if (otherAudio !== audio) {

                otherAudio.pause();

                otherPlayer
                  .querySelector(
                    ".play-button"
                  )
                  .textContent = "▶";

              }

            }
          );


          if (audio.paused) {

            audio.play();

            playButton.textContent =
              "Ⅱ";

          } else {

            audio.pause();

            playButton.textContent =
              "▶";

          }

        }
      );


      /* 再生位置 */

      audio.addEventListener(
        "timeupdate",
        () => {

          if (!audio.duration) {
            return;
          }

          const percent =
            (
              audio.currentTime /
              audio.duration
            ) * 100;

          progressFill.style.width =
            percent + "%";

          progressDot.style.left =
            percent + "%";

          currentTime.textContent =
            formatTime(
              audio.currentTime
            );

        }
      );


      /* 曲の長さ */

      audio.addEventListener(
        "loadedmetadata",
        () => {

          duration.textContent =
            formatTime(
              audio.duration
            );

        }
      );


      /* 曲終了 */

      audio.addEventListener(
        "ended",
        () => {

          playButton.textContent =
            "▶";

          progressFill.style.width =
            "0%";

          progressDot.style.left =
            "0%";

          currentTime.textContent =
            "0:00";

        }
      );


      /* プログレスバー */

      progressBar.addEventListener(
        "click",
        event => {

          if (!audio.duration) {
            return;
          }

          const rect =
            progressBar.getBoundingClientRect();

          const position =
            (
              event.clientX -
              rect.left
            ) / rect.width;

          audio.currentTime =
            position *
            audio.duration;

        }
      );


      /* ダウンロードメニュー */

      menuButton.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          document
            .querySelectorAll(".menu")
            .forEach(otherMenu => {

              if (otherMenu !== menu) {

                otherMenu.classList.remove(
                  "open"
                );

              }

            });

          menu.classList.toggle(
            "open"
          );

        }
      );

    });


    /* メニューを閉じる */

    document.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".menu")
          .forEach(menu => {

            menu.classList.remove(
              "open"
            );

          });

      }
    );


    /* Lyrics Card */

    const lyricsButton =
      document.querySelector(
        ".lyrics-button"
      );

    const lyricsModal =
      document.querySelector(
        ".lyrics-modal"
      );

    const lyricsClose =
      document.querySelector(
        ".lyrics-close"
      );


    lyricsButton.addEventListener(
      "click",
      () => {

        lyricsModal.classList.add(
          "open"
        );

      }
    );


    lyricsClose.addEventListener(
      "click",
      () => {

        lyricsModal.classList.remove(
          "open"
        );

      }
    );


    /* 背景クリックで閉じる */

    lyricsModal.addEventListener(
      "click",
      event => {

        if (
          event.target === lyricsModal
        ) {

          lyricsModal.classList.remove(
            "open"
          );

        }

      }
    );

  </script>
