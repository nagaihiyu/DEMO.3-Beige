<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 検索避け -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Adobe Fonts -->
  <script>
    (function(d) {
      var config = {
        kitId: 'qtl1pmd',
        scriptTimeout: 3000,
        async: true
      },
      h = d.documentElement,
      t = setTimeout(function() {
        h.className = h.className.replace(/\bwf-loading\b/g, "") + " wf-inactive";
      }, config.scriptTimeout),
      tk = d.createElement("script"),
      f = false,
      s = d.getElementsByTagName("script")[0],
      a;

      h.className += " wf-loading";
      tk.src = 'https://use.typekit.net/' + config.kitId + '.js';
      tk.async = true;

      tk.onload = tk.onreadystatechange = function() {
        a = this.readyState;

        if (f || (a && a != "complete" && a != "loaded")) {
          return;
        }

        f = true;
        clearTimeout(t);

        try {
          Typekit.load(config);
        } catch (e) {}
      };

      s.parentNode.insertBefore(tk, s);
    })(document);
  </script>

  <title>DEMO.3「Beige」</title>

  <style>

    body {
      margin: 0;
      padding: 50px 24px;
      background: #a0d8ef;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Sans", "Yu Gothic", sans-serif;
      font-weight: 300;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-family: "dnp-shuei-nmincho-std", sans-serif;
      font-size: 24px;
      font-weight: 400;
      font-style: normal;
      margin: 0 0 8px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 300;
      margin-bottom: 50px;
    }

    .track {
      margin-bottom: 40px;
    }

    .title {
      font-family: "dnp-shuei-nmincho-std", sans-serif;
      font-size: 16px;
      font-weight: 400;
      font-style: normal;
      margin-bottom: 10px;
    }

    .number {
      display: inline-block;
      width: 30px;
      color: rgba(255, 255, 255, 0.65);
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 13px;
      font-weight: 300;
    }

    audio {
      width: 100%;
      height: 40px;
    }

    footer {
      margin-top: 70px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 11px;
      font-weight: 300;
      line-height: 1.8;
    }

  </style>
</head>

<body>

  <main>

    <h1>DEMO.3「Beige」</h1>

    <div class="subtitle">
      5 tracks
    </div>


    <div class="track">

      <div class="title">
        <span class="number">01</span>みずうみのゆめ
      </div>

      <audio controls preload="none">
        <source src="01.mp3" type="audio/mpeg">
      </audio>

    </div>


    <div class="track">

      <div class="title">
        <span class="number">02</span>とうめい
      </div>

      <audio controls preload="none">
        <source src="02.mp3" type="audio/mpeg">
      </audio>

    </div>


    <div class="track">

      <div class="title">
        <span class="number">03</span>平行
      </div>

      <audio controls preload="none">
        <source src="03.mp3" type="audio/mpeg">
      </audio>

    </div>


    <div class="track">

      <div class="title">
        <span class="number">04</span>papa
      </div>

      <audio controls preload="none">
        <source src="04.mp3" type="audio/mpeg">
      </audio>

    </div>


    <div class="track">

      <div class="title">
        <span class="number">05</span>すりがらす
      </div>

      <audio controls preload="none">
        <source src="05.mp3" type="audio/mpeg">
      </audio>

    </div>


    <footer>
      無断配布禁止<br>
      © 2026 Nagai Hiyu
    </footer>

  </main>


  <!-- 複数の曲を同時再生しない -->
  <script>

    const players = document.querySelectorAll("audio");

    players.forEach(player => {

      player.addEventListener("play", () => {

        players.forEach(other => {

          if (other !== player) {
            other.pause();
          }

        });

      });

    });

  </script>

</body>
</html>
